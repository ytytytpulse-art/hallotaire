<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* .Hallo.: dark site shell in the style of the big chess sites. Left menu, charcoal content, green board, 3D green call-to-action buttons. */
:root {
  --bg: #2d2347;
  --side: #211a38;
  --card: #382c58;
  --card2: #41346a;
  --line: rgba(255, 255, 255, .08);
  --ink: #ffffff;
  --ink-soft: #c1b6dd;
  --rule: #5b4b92;
  --accent: #b79cf0;
  --accent-dk: #7650c4;
  --accent-hi: #d6c4fa;
  --danger: #e5604b;
  --warn: #f0b23c;
  --on-ink: #382c58;
  --scrim: rgba(0, 0, 0, .72);
  --font-display: 'Montserrat', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  --font-body: 'Noto Sans', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --btn: #4b3d78; --btn-hi: #5b4b92; --btn-sh: #2a2048; --panel: #271f42; --sel: #4a3c7a; --deep: #1c1530;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-family: var(--font-display); }
p { margin: 0 0 .8em; }
canvas { max-width: 100%; }

.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.sidenav {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px;
  background: var(--side); padding: 14px 8px 12px max(8px, env(safe-area-inset-left, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; cursor: pointer; border: 0; background: transparent; text-align: left; }
.brand canvas { width: 36px; height: 36px; flex: none; }
.bname { font-family: var(--font-display); font-weight: 800; font-size: 1.12rem; line-height: 1.05; letter-spacing: -.01em; color: #fff; }
.bname i { font-style: normal; color: var(--accent); }
.navlist { display: flex; flex-direction: column; gap: 2px; }
.nav { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; border-radius: 6px; background: transparent; color: #e0d8f2; font-family: var(--font-display); font-weight: 700; font-size: .95rem; cursor: pointer; text-align: left; }
.nav svg { width: 26px; height: 26px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav svg .f { fill: currentColor; fill-opacity: .2; stroke: none; }
.nav svg .a { stroke: var(--accent-hi); }
.nav[aria-current="page"] svg .f { fill: var(--accent); fill-opacity: .35; }
.nav:hover { background: #3a2e60; color: #fff; }
.nav[aria-current="page"] { background: var(--sel); color: #fff; }
.nav[aria-current="page"] svg { color: var(--accent-hi); }
.nav .new { margin-left: auto; font-size: .62rem; letter-spacing: .06em; background: var(--accent); color: #1d1033; padding: 2px 6px; border-radius: 3px; }
.nav:focus-visible, .btn:focus-visible, .bot:focus-visible, .tab:focus-visible, .opt:focus-within, .iconbtn:focus-visible, .board-box canvas:focus-visible, .ocard:focus-visible, .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px 2px; border-top: 1px solid var(--line); }
.me b { display: block; font-size: .92rem; line-height: 1.2; }
.me small { display: block; color: var(--ink-soft); font-size: .75rem; }
.av { width: 40px; height: 40px; border-radius: 4px; flex: none; display: block; }
.av.lg { width: 64px; height: 64px; }
.av.xl { width: 104px; height: 104px; }
.sr { font-family: var(--font-mono); font-size: .8rem; color: var(--ink-soft); font-weight: 500; }

.main { min-width: 0; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px 28px; }
.view { max-width: 1160px; margin-inline: auto; }
.ptitle { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.7rem, 3.6vw, 2.3rem); line-height: 1.12; margin-bottom: 6px; }
.psub { color: var(--ink-soft); max-width: 40em; margin-bottom: 20px; }

/* buttons: chunky green 3D buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em; font-family: var(--font-display); font-weight: 700; font-size: .92rem;
  padding: .55em 1em; min-height: 44px; background: var(--btn); color: #fff; border: 0; border-radius: 8px; cursor: pointer;
  box-shadow: 0 4px 0 var(--btn-sh); transition: background .12s, transform .06s, box-shadow .06s; position: relative; top: 0;
}
.btn:hover { background: var(--btn-hi); }
.btn:active { top: 3px; box-shadow: 0 1px 0 var(--btn-sh); }
.btn.primary { background: var(--accent); color: #1d1033; box-shadow: 0 4px 0 var(--accent-dk); }
.btn.primary:hover { background: var(--accent-hi); }
.btn.primary:active { box-shadow: 0 1px 0 var(--accent-dk); }
.btn.big { min-height: 62px; font-size: 1.35rem; padding: .6em 1.6em; border-radius: 10px; font-weight: 800; }
.btn.small { min-height: 36px; font-size: .84rem; padding: .35em .9em; box-shadow: 0 3px 0 var(--btn-sh); }
.btn.small.primary { box-shadow: 0 3px 0 var(--accent-dk); }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .38; cursor: not-allowed; pointer-events: none; }
.btn.on { background: var(--accent); color: #1d1033; box-shadow: 0 4px 0 var(--accent-dk); }
.btn.ghost { background: transparent; box-shadow: none; border: 1px solid var(--rule); }
.btn.ghost:hover { background: var(--btn); }

.card { background: var(--card); border-radius: 8px; padding: 14px 16px; }
.card h3 { font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }

/* home */
.home { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: clamp(26px, 5vw, 64px); align-items: center; min-height: calc(100vh - 100px); }
.frame-art { width: 100%; max-width: 560px; margin-inline: auto; }
.frame-art canvas, .board-box canvas { display: block; width: 100%; border-radius: 4px; box-shadow: 0 24px 40px -18px rgba(0,0,0,.6); }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 5.2vw, 3.5rem); line-height: 1.04; margin-bottom: 14px; letter-spacing: -.02em; }
.hero h1 span { color: var(--accent); }
.hero .lede { font-size: 1.05rem; color: #e3dcf3; max-width: 27em; margin-bottom: 22px; }
.hero .stack { display: grid; gap: 12px; max-width: 380px; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); max-width: 380px; }
.stats div { font-size: .78rem; color: var(--ink-soft); }
.stats b { display: block; font-size: 1.35rem; color: #fff; font-family: var(--font-display); font-weight: 800; line-height: 1.2; }

/* bots */
.bots-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.tier { font-size: .72rem; font-weight: 800; font-family: var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin: 18px 0 8px; }
.tier:first-child { margin-top: 0; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bot { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; background: var(--card); border: 2px solid transparent; border-radius: 8px; cursor: pointer; text-align: left; transition: border-color .12s, transform .12s, background .12s; }
.bot:hover { background: var(--card2); transform: translateY(-1px); }
.bot.sel { border-color: var(--accent); background: var(--card2); }
.bot b { font-size: 1rem; font-family: var(--font-display); }
.bdetail { position: sticky; top: 20px; }
.bdetail .top { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.bdetail h2 { font-weight: 800; font-size: 1.7rem; line-height: 1.1; }
.bdetail .tag { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
.bdetail ul { list-style: none; margin: 12px 0 14px; padding: 0; font-size: .87rem; color: var(--ink-soft); }
.bdetail li { padding: 6px 0; border-top: 1px solid var(--line); }
.bdetail .lbl { display: block; font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin: 14px 0 6px; font-family: var(--font-display); }
.segbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
.segbtns button { padding: .55em .4em; min-height: 40px; background: var(--panel); border: 2px solid transparent; border-radius: 6px; font-weight: 700; font-size: .85rem; cursor: pointer; color: #e3dcf3; }
.segbtns button[aria-pressed="true"] { border-color: var(--accent); color: #fff; background: #41346a; }
.waitnote { font-size: .8rem; color: var(--warn); margin: -4px 0 10px; }

/* game */
.game { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.bwrap { width: 100%; max-width: min(740px, max(340px, calc(100vh - 190px))); margin-inline: auto; display: flex; flex-direction: column; gap: 8px; }
.pstrip { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.pstrip .pn { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.pstrip .pn b { font-size: .95rem; font-family: var(--font-display); }
.pcap { display: flex; align-items: center; margin-left: 6px; min-height: 22px; }
.pcap img { width: 22px; height: 22px; margin-right: -8px; }
.ppil { margin-left: auto; display: inline-flex; gap: 4px; }
.pill { width: 11px; height: 17px; background: #a79f8f; border: 1.5px solid var(--btn-sh); border-radius: 2px; }
.pill.gone { opacity: .18; }
.sqread { text-align: center; font-family: var(--font-mono); font-size: .76rem; color: var(--ink-soft); min-height: 1.3em; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.headline { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; line-height: 1.2; }
.subline { color: var(--ink-soft); font-size: .88rem; min-height: 1.4em; margin-top: 2px; }
.pips { display: flex; gap: 6px; margin: 10px 0 2px; align-items: center; font-size: .78rem; color: var(--ink-soft); }
.pips span { margin-right: 4px; }
.pip { width: 13px; height: 13px; border: 2px solid var(--accent); border-radius: 50%; }
.pip.used { background: var(--accent); }
.throneline { margin-top: 12px; padding: 2px 0 2px 10px; border-left: 3px solid var(--accent); font-size: .84rem; }
.throneline.alert { border-left-color: var(--danger); }
.pieceinfo { margin-top: 8px; font-size: .82rem; color: var(--ink-soft); min-height: 2.4em; }
.thinking { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 8px; }
.thinking i { width: 7px; height: 7px; background: var(--accent); opacity: .2; animation: tick 1.1s infinite; border-radius: 50%; }
.thinking i:nth-child(2) { animation-delay: .18s; } .thinking i:nth-child(3) { animation-delay: .36s; } .thinking i:nth-child(4) { animation-delay: .54s; }
@keyframes tick { 0%, 100% { opacity: .15; } 40% { opacity: 1; } }
.evalbar { height: 8px; background: var(--deep); margin: 8px 0 6px; border-radius: 4px; overflow: hidden; }
.evalbar b { display: block; height: 100%; background: #fbf8ff; width: 50%; transition: width .6s ease; }
.mstats { font-size: .82rem; color: var(--ink-soft); }
.log { max-height: 210px; overflow: auto; font-family: var(--font-mono); font-size: .76rem; margin: 0; padding: 0; list-style: none; }
.log li { padding: 5px 6px; display: flex; gap: 8px; border-radius: 3px; }
.log li:nth-child(odd) { background: rgba(255,255,255,.035); }
.log .n { color: var(--ink-soft); min-width: 2em; text-align: right; }
.log .who { min-width: 4.8em; color: var(--ink-soft); }
.log .you .who { color: #fff; font-weight: 500; }
.log .empty { color: var(--ink-soft); font-family: var(--font-body); }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.controls .btn { width: 100%; }

/* coach panel */
.coach { border-left: 4px solid var(--accent); background: #443a78; }
.coach h3 { color: var(--accent-hi); display: flex; align-items: center; gap: 8px; }
.coach .cline { font-size: .86rem; padding: 6px 0; border-top: 1px solid rgba(255,255,255,.07); color: #efe9fb; }
.coach .cline:first-of-type { border-top: 0; }
.coach .cline.bad { color: #ffb3a6; } .coach .cline.warn { color: #ffd98a; } .coach .cline.good { color: #d9c9fb; }
.coach .review { display: flex; gap: 10px; align-items: baseline; margin-top: 6px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.1); font-size: .85rem; }
.grade { font-family: var(--font-display); font-weight: 800; font-size: .74rem; padding: 2px 8px; border-radius: 3px; white-space: nowrap; color: #1d1033; }
.grade.best { background: #b79cf0; } .grade.good { background: #c9b6f5; } .grade.inacc { background: #f7c631; }
.grade.mistake { background: #e58f2a; } .grade.blunder, .grade.miss { background: #ca3431; color: #fff; }
.coach .why { font-size: .82rem; color: #ddd4f2; margin-top: 4px; }

/* sheet (learn pages, dialogs) */
.sheet, .modal { background: var(--card); color: var(--ink); border-radius: 8px; }
.sheet { overflow: hidden; }
.tabs { flex: 0 0 auto; display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden; padding: 0 12px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab { flex: 0 0 auto; font-family: var(--font-display); font-weight: 700; font-size: .86rem; padding: .9em .95em; background: transparent; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; cursor: pointer; color: var(--ink-soft); }
.tab:hover { color: #fff; }
.tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }
.mbody { padding: 16px 20px 24px; overflow: auto; min-height: 0; }
.mbody h3 { font-weight: 800; font-size: 1.25rem; margin: 6px 0 8px; }
.mbody h4 { font-size: .95rem; font-weight: 800; margin: 16px 0 4px; }
.mbody ul, .mbody ol { margin: 0 0 .9em; padding-left: 1.25em; }
.mbody li { margin-bottom: .4em; }
.mbody strong { font-weight: 700; color: #fff; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; margin: 12px 0 8px; }
.dgrid figure { margin: 0; }
.dgrid canvas { width: 100%; max-width: 260px; display: block; margin-inline: auto; border-radius: 3px; }
.dgrid figcaption { text-align: center; font-size: .82rem; color: var(--ink-soft); margin-top: 6px; }
.dgrid h4 { text-align: center; margin: 0 0 6px; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.callout { border-left: 4px solid var(--accent); background: rgba(183,156,240,.12); padding: 8px 12px; margin: 12px 0; border-radius: 0 6px 6px 0; }

/* settings + radio options */
.setgroup { max-width: 640px; margin-bottom: 14px; }
.opts { display: grid; gap: 6px; margin: 4px 0 4px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 2px solid transparent; background: var(--panel); border-radius: 6px; cursor: pointer; }
.opt input { margin-top: .3em; accent-color: var(--accent); }
.opt b { font-weight: 700; display: block; font-size: .93rem; }
.opt span { font-size: .83rem; color: var(--ink-soft); display: block; }
.opt.sel { border-color: var(--accent); }

/* dialog */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
.modal { width: 100%; max-width: 500px; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 30px 60px -20px rgba(0,0,0,.7); }
.mhead { display: flex; align-items: center; gap: 12px; padding: 14px 18px 8px; }
.mhead h2 { font-weight: 800; font-size: 1.5rem; margin-right: auto; }
.iconbtn { width: 38px; height: 38px; border: 0; background: var(--btn); border-radius: 6px; cursor: pointer; font-size: 1.3rem; line-height: 1; color: #fff; }
.iconbtn:hover { background: var(--btn-hi); }
.endrow { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; font-family: var(--font-display); }
.endrow b { font-size: 1.5rem; font-weight: 800; }
.endrow .d { color: var(--accent-hi); } .endrow .d.neg { color: var(--danger); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }

/* openings */
.ofilters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.ofilters .btn { min-height: 36px; padding: .3em .9em; box-shadow: none; font-size: .82rem; }
.ofilters .btn.on { box-shadow: none; }
.ogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.ocard { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--card); border: 2px solid transparent; border-radius: 8px; cursor: pointer; text-align: left; transition: border-color .12s, transform .12s, background .12s; }
.ocard:hover { background: var(--card2); transform: translateY(-2px); border-color: var(--accent); }
.ocard canvas { width: 100%; border-radius: 4px; pointer-events: none; }
.ocard b { font-family: var(--font-display); font-size: 1.05rem; font-weight: 800; }
.ocard small { color: var(--ink-soft); }
.lvl { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: .66rem; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; color: #1d1033; margin-right: 6px; }
.lvl.Beginner { background: #b79cf0; } .lvl.Intermediate { background: #f7c631; } .lvl.Advanced { background: #e58f2a; } .lvl.Trap { background: #ca3431; color: #fff; } .lvl.Crusher { background: #4ade80; color: #07210f; }
.oview { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.oview .bwrap { max-width: min(660px, max(340px, calc(100vh - 220px))); }
.oside { display: flex; flex-direction: column; gap: 12px; }
.oside h2 { font-weight: 800; font-size: 1.6rem; line-height: 1.12; }
.oturn { display: flex; gap: 8px; align-items: baseline; font-size: .84rem; padding: 6px 8px; border-radius: 4px; cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; color: inherit; }
.oturn:hover { background: rgba(255,255,255,.06); }
.oturn.cur { background: var(--sel); }
.oturn .k { font-family: var(--font-mono); color: var(--ink-soft); min-width: 3.4em; }
.onote { font-size: .88rem; min-height: 4.4em; line-height: 1.5; }
.onote .w { color: #fff; font-weight: 700; }
.ocap { color: var(--danger); font-weight: 700; }
.ev { height: 8px; background: var(--deep); border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
.ev b { display: block; height: 100%; background: #fbf8ff; width: 50%; transition: width .3s; }

/* lessons */
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 18px; }
.lcard { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border: 2px solid transparent; border-radius: 8px; cursor: pointer; text-align: left; }
.lcard:hover { background: var(--card2); border-color: var(--accent); }
.lcard .num { width: 34px; height: 34px; border-radius: 50%; background: var(--btn); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; flex: none; }
.lcard.done .num { background: var(--accent); color: #1d1033; }
.lcard b { display: block; font-family: var(--font-display); font-size: .95rem; }
.lcard span { font-size: .78rem; color: var(--ink-soft); }
.lview { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.lview .bwrap { max-width: min(600px, max(340px, calc(100vh - 200px))); }
.lmsg { font-size: .9rem; min-height: 3.2em; margin-top: 8px; }
.lmsg.ok { color: #d9c9fb; } .lmsg.no { color: #ffb3a6; }

/* code panel: nearly invisible during a game */

  moves: ['Your moves', '<h3>What you can do on your turn</h3><ul><li><strong>Draw</strong>: take another card.</li><li><strong>Hold</strong>: keep your hand.</li><li><strong>Raise</strong>: double your bet, receive exactly one more card, then hold.</li><li><strong>Fork</strong>: with two cards of equal value, split them into two hands by matching your bet. You can have up to four hands. Forked aces receive one card each.</li><li><strong>Fold</strong> (some tables): give up the hand and get half your bet back. Only on your first two cards.</li><li><strong>Hedge</strong>: when the host shows an Ace you can bet half your wager that the host has a Crown. It pays 2:1. It loses money on average. Taking \u201ceven payout\u201d on your own Crown is the same bet.</li></ul><p>Keys at the table: <strong>D</strong> draw, <strong>H</strong> hold, <strong>R</strong> raise, <strong>K</strong> fork, <strong>F</strong> fold, <strong>Enter</strong> deal.</p>'],
  charms: ['Charms and Heat', '<h3>Two things you will not find in a normal casino</h3><h4>Charms</h4><p>Charms are single-use boosts you buy in the Boutique. They cost chips, so they are a gamble of their own.</p><ul><li><strong>Peek</strong>: see the next card in the deck before you decide.</li><li><strong>Rewind</strong>: undo your last draw. You are offered it right after a burst.</li></ul><h4>Heat</h4><p>Every round you win in a row builds <strong>Heat</strong>, up to 5. Heat multiplies the Aura you earn (+20% per level) but never changes your payouts. Lose a round and the Heat is gone.</p>'],
  side: ['Side bets', '<h3>Two optional side bets</h3><p>Side bets are separate from your hand and resolve as soon as the cards are dealt. They are fun, but they have a bigger house edge than the main game.</p><h4>Twins (your first two cards)</h4><ul><li>Odd Twins (same rank, one warm suit and one cool suit): <strong>5 to 1</strong></li><li>Kindred Twins (same rank, both warm or both cool, different suit): <strong>12 to 1</strong></li><li>Mirror Twins (same rank, same suit): <strong>25 to 1</strong></li></ul><p>Sun and Star are warm suits. Moon and Bloom are cool suits.</p><h4>Trio (your first two cards plus the host card)</h4><ul><li>Suited (all one suit): <strong>5 to 1</strong></li><li>Run (three in a row): <strong>10 to 1</strong></li><li>Triple (same rank): <strong>30 to 1</strong></li><li>Royal Run (a suited run): <strong>40 to 1</strong></li><li>Perfect Triple (same rank, same suit): <strong>100 to 1</strong></li></ul><p>The Trio circle is left of your main bet and the Twins circle is on the right. Tap a circle with a chip selected to bet.</p>'],
  rules: ['Table rules', '<h3>Small rules, big differences</h3><ul><li><strong>3:2 versus 6:5.</strong> A Crown that pays 6:5 adds roughly 1.4% to the house edge. It is the single worst rule change.</li><li><strong>Host draws on soft 17</strong> costs the player about 0.2%.</li><li><strong>Late fold</strong> helps you by about 0.07%.</li><li><strong>Raise after fork</strong> and <strong>refork aces</strong> are small player advantages.</li><li><strong>Five-card Run</strong> (five cards without a burst wins automatically) is a big player advantage found at The Run Room.</li><li><strong>Fewer decks</strong> is slightly better for the player, but only if the payout stays at 3:2.</li></ul><div class="callout">Check the badges in the Tables menu. A table that looks friendly, like a single deck, can be worse than a normal table if it pays 6:5.</div>'],
  odds: ['House edge', '<h3>What the house edge means</h3><p>If you play the best move every time at a good table, the house edge is under 0.5%. That is about 50 cents on every $100 wagered, on average, over a very long time. Ignoring the chart typically costs another 2% or more. Side bets sit around 3% to 8%.</p><p>No strategy can beat the game in the short run: results swing wildly. The tutor is there so that you at least never give the edge away through avoidable mistakes.</p><h4>Hedge</h4><p>A Hedge wins about 31% of the time but needs about 33% to break even, so it loses money in the long run.</p>'],
  count: ['Card counting', '<h3>Hi-Lo counting basics</h3><p>Small cards (2\u20136) help the host, high cards (10, P, N, M, A) help you. Count them as they appear: <strong>2\u20136 = +1</strong>, <strong>7\u20139 = 0</strong>, <strong>10\u2013A = \u22121</strong>. The total is the <strong>running count</strong>.</p><p>Divide the running count by the number of decks still in the deck for the <strong>true count</strong>. A high positive true count means the remaining cards are rich in tens and aces.</p><p>At the tables, turn on the counter in the side panel to check your own count. Practice in the Trainer\u2019s Count drill first.</p>']
};

function drawChart(cv) {

  var mn = Math.min.apply(null, H), mx = Math.max.apply(null, H); if (mx === mn) mx = mn + 1;
  var pl = 56, pr = 14, pt = 16, pb = 20;
  x.strokeStyle = 'rgba(255,255,255,.1)'; x.fillStyle = '#c1b6dd'; x.font = '11px IBM Plex Mono, monospace'; x.textAlign = 'right';
  for (i = 0; i <= 4; i++) { var yy = pt + (h - pt - pb) * i / 4, vv = mx - (mx - mn) * i / 4; x.beginPath(); x.moveTo(pl, yy); x.lineTo(w - pr, yy); x.stroke(); x.fillText('$' + Math.round(vv).toLocaleString('en-US'), pl - 6, yy + 4); }
  var g = x.createLinearGradient(0, pt, 0, h - pb); g.addColorStop(0, 'rgba(183,156,240,.45)'); g.addColorStop(1, 'rgba(183,156,240,0)');
  x.beginPath(); H.forEach(function (v, k) { var px = pl + (w - pl - pr) * k / (H.length - 1), py = pt + (h - pt - pb) * (1 - (v - mn) / (mx - mn)); if (k) x.lineTo(px, py); else x.moveTo(px, py); });
  x.strokeStyle = '#d6c4fa'; x.lineWidth = 2; x.stroke(); x.lineTo(w - pr, h - pb); x.lineTo(pl, h - pb); x.fillStyle = g; x.fill();
}

  if (keep && G.last) G.last.forEach(function (b, i) { var s = G.spots[i]; if (s) { s.main = b.main; s.pp = b.pp; s.t3 = b.t3; } });
  startBetting(); refreshBets();
}
function rebetAndDeal() { toBetting(true); if (G.spots.some(function (s) { return s.main >= G.tb.min; })) playRound(); }

async function playHand(s, h, hi) {
  var tb = G.tb; h.el.classList.add('active');
  while (true) {
    if (h.cards.length === 1) { await giveCard(h, true); }
    var t = HE.total(h.cards).t;
    if (HE.isNatural(h.cards) && !h.fromSplit) break;
    if (t >= 21) break;
    if (tb.charlie && h.cards.length >= 5) break;
    var n = s.hands.length, pairOK = h.cards.length === 2 && HE.val(h.cards[0]) === HE.val(h.cards[1]);
    var onlyAceSplit = false;
    if (h.splitAce && h.cards.length >= 2) {
      if (tb.rsa && h.cards[0].r === 1 && h.cards[1].r === 1 && n < 4 && P.bank >= h.bet) onlyAceSplit = true; else break;
    }
    var avail = {
      hit: !onlyAceSplit, stand: true,
      double: !onlyAceSplit && h.cards.length === 2 && P.bank >= h.bet && (!h.fromSplit || tb.das),
      split: pairOK && n < 4 && P.bank >= h.bet && (!h.splitAce || onlyAceSplit),
      surrender: !!tb.surrender && h.cards.length === 2 && !h.fromSplit && n === 1
    };
    var best = HE.bestAction(h.cards, G.dealer.cards[0], tb, avail);
    if (onlyAceSplit) best = 'P';
    if (!G.keepHint) hint(''); G.keepHint = false; G.hinted = false;
    var act = await waitAction(h, s, avail, best);
    $('dock').innerHTML = '<div class="hint">&nbsp;</div>';
    if (act === 'PEEK') { P.charms.peek--; saveP(); var nx = G.shoe[G.shoe.length - 1]; hint('Peek: the next card is the ' + HE.RANKS[nx.r] + ' of ' + HE.SUITS[nx.s] + ' (' + (nx.r === 1 ? 'Ace' : HE.val(nx)) + ').'); G.keepHint = true; sfx.flip(); continue; }
    if (act === 'REW') { P.charms.rewind--; saveP(); undoDraw(h); sfx.flip(); continue; }
    var ok = act === best; P.st.dec++; if (ok) { P.st.ok++; track('ok'); }
    var names = { H: 'Draw', S: 'Hold', D: 'Raise', P: 'Fork', R: 'Fold' };
    tutorSay(ok, ok ? names[act] + ' is right. ' + HE.describe(h.cards, G.dealer.cards[0], best) : names[act] + ' was not the best play. ' + HE.describe(h.cards, G.dealer.cards[0], best));
    if (act === 'H') { await giveCard(h, true); h.drew = true; if (HE.total(h.cards).t > 21) { await wait(350); if (P.charms.rewind > 0 && await rewindPrompt()) { P.charms.rewind--; saveP(); undoDraw(h); sfx.flip(); continue; } break; } continue; }
    if (act === 'S') break;
    if (act === 'D') { P.bank -= h.bet; h.bet *= 2; h.doubled = true; sfx.chip(); updateMe(); $('bank').textContent = money(P.bank); refreshHand(h, false); await giveCard(h, true); await wait(300); break; }
    if (act === 'R') { h.sur = true; sfx.click(); break; }
    if (act === 'P') {
      P.bank -= h.bet; P.st.splits++; sfx.chip();
      var moved = h.cards.pop(), nh = newHand(h.bet, true); nh.cards.push(moved);
      var movedEl = h.cardsEl.lastChild; h.cardsEl.removeChild(movedEl);
      var ne = buildHandEl(nh, false); nh.cardsEl.appendChild(movedEl); h.el.parentNode.insertBefore(ne, h.el.nextSibling);
      h.fromSplit = true; var ace = moved.r === 1; h.splitAce = ace; nh.splitAce = ace;
      s.hands.splice(hi + 1, 0, nh); refreshHand(h, false); refreshHand(nh, false); $('bank').textContent = money(P.bank);
      await wait(300); continue;
    }
  }
  h.el.classList.remove('active'); refreshHand(h, false);
}

/* confetti */
function confetti() {
  var cv = $('conf'); if (!cv) return; var w = cv.width = innerWidth, hh = cv.height = innerHeight, x = cv.getContext('2d'), ps = [], i, cols = ['#f5c542', '#d6c4fa', '#b79cf0', '#fff', '#7be0b4', '#f49ac1'];
  for (i = 0; i < 110; i++) ps.push({ x: w * (.3 + Math.random() * .4), y: hh * .55, vx: (Math.random() - .5) * 14, vy: -8 - Math.random() * 12, r: 3 + Math.random() * 4, c: cols[i % cols.length], a: Math.random() * 6, va: (Math.random() - .5) * .4 });
  var t0 = performance.now();
  (function f(t) {
    var e = t - t0; x.clearRect(0, 0, w, hh);
    ps.forEach(function (p) { p.vy += .4; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.globalAlpha = Math.max(0, 1 - e / 2200); x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); });
    if (e < 2300) requestAnimationFrame(f); else x.clearRect(0, 0, w, hh);
  })(t0);
}

/* keyboard */
document.addEventListener('keydown', function (e) {
  if (cur !== 'game' || !G || e.ctrlKey || e.metaKey || e.altKey) return;
  var tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
  var k = e.key.toUpperCase();
  if (G.phase === 'player' && G.resolve) {
    var all = document.querySelectorAll('#acts .abtn');
    for (var i = 0; i < all.length; i++) if (all[i].querySelector('kbd') && all[i].querySelector('kbd').textContent === k) { e.preventDefault(); all[i].click(); return; }
  } else if (e.key === 'Enter' || e.key === ' ') {
    if (G.phase === 'bet') { var d = $('dealBtn'); if (d && !d.disabled) { e.preventDefault(); d.click(); } }
    else if (G.phase === 'settled') { var a = $('again'); if (a && !a.disabled) { e.preventDefault(); a.click(); } }
  }
});
